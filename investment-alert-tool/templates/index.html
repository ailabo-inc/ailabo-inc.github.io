<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>投資ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --card2: #F2F2F7;
      --border: rgba(60,60,67,0.12);
      --text: #1C1C1E;
      --text2: #8E8E93;
      --text3: #AEAEB2;
      --green: #30D158;
      --red: #FF3B30;
      --orange: #FF9F0A;
      --blue: #0A84FF;
      --purple: #BF5AF2;
      --green-soft: rgba(48,209,88,0.14);
      --red-soft: rgba(255,59,48,0.14);
      --blue-soft: rgba(10,132,255,0.14);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --card2: #2C2C2E;
        --border: rgba(255,255,255,0.1);
        --text: #FFFFFF;
        --text2: #8E8E93;
        --text3: #636366;
        --green-soft: rgba(48,209,88,0.18);
        --red-soft: rgba(255,59,48,0.18);
        --blue-soft: rgba(10,132,255,0.18);
        --shadow: 0 2px 12px rgba(0,0,0,0.4);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
    }

    /* ── ヘッダー ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      padding: calc(env(safe-area-inset-top) + 10px) 20px 10px;
      background: rgba(242,242,247,0.75);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-bottom: 1px solid var(--border);
    }
    @media (prefers-color-scheme: dark) {
      .header { background: rgba(0,0,0,0.75); }
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon {
      width: 34px; height: 34px; border-radius: 17px;
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; box-shadow: var(--shadow);
    }
    .btn-icon.active { background: var(--blue-soft); border-color: var(--blue); }
    .btn-refresh-main {
      height: 34px; border-radius: 17px; padding: 0 16px;
      background: var(--blue); color: #fff; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(10,132,255,0.35);
    }
    .btn-refresh-main:active { opacity: 0.8; }
    .spin-icon { display: none; }
    .btn-refresh-main.loading .spin-icon { display: inline; animation: spin 0.8s linear infinite; }
    .btn-refresh-main.loading .static-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ヒーローセクション ── */
    .hero {
      margin: 16px 16px 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 24px 22px 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(10,50,96,0.4);
    }
    .hero::before {
      content: '';
      position: absolute; top: -40%; right: -20%; width: 60%; height: 130%;
      background: radial-gradient(circle, rgba(10,132,255,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-label { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
    .hero-total { font-size: 38px; font-weight: 800; color: #fff; letter-spacing: -1px; line-height: 1.1; margin: 6px 0 4px; }
    .hero-pnl { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
    .hero-pnl.pos { color: #30D158; }
    .hero-pnl.neg { color: #FF3B30; }
    .hero-breakdown {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-top: 4px;
    }
    .hero-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 12px;
    }
    .hero-item-label { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; }
    .hero-item-val { font-size: 14px; font-weight: 700; color: #fff; }
    .hero-item-pnl { font-size: 11px; font-weight: 600; margin-top: 2px; }
    .hero-item-pnl.pos { color: #30D158; }
    .hero-item-pnl.neg { color: #FF453A; }
    .hero-loading { color: rgba(255,255,255,0.4); font-size: 14px; }

    /* ── タブ ── */
    .tabs-wrap { padding: 16px 16px 0; }
    .tabs {
      display: flex; background: var(--card2);
      border-radius: 12px; padding: 3px; gap: 0;
    }
    .tab-btn {
      flex: 1; border: none; background: none;
      border-radius: 9px; padding: 9px 0;
      font-size: 15px; font-weight: 600;
      color: var(--text2); cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }

    /* ── コンテンツ ── */
    .content { padding: 0 16px; max-width: 600px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── セクション ── */
    .section-label {
      font-size: 13px; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin: 22px 0 10px 2px;
    }

    /* ── カード ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      padding: 16px 16px 12px;
    }
    .card-left { display: flex; align-items: flex-start; gap: 12px; }
    .sym-icon {
      width: 42px; height: 42px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; line-height: 1.2;
      text-align: center; flex-shrink: 0;
    }
    .sym-icon.jp { background: var(--green-soft); color: var(--green); }
    .sym-icon.us { background: var(--blue-soft); color: var(--blue); }
    .sym-icon.fund { background: var(--blue-soft); color: var(--blue); font-size: 10px; }
    .card-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .card-right { text-align: right; flex-shrink: 0; }
    .card-price { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; }
    .card-change { font-size: 13px; font-weight: 700; margin-top: 2px; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    /* ── P&Lバー ── */
    .pnl-bar {
      margin: 0 16px 12px;
      background: var(--card2);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pnl-bar-left { font-size: 12px; color: var(--text2); }
    .pnl-bar-left strong { font-size: 13px; font-weight: 700; color: var(--text); }
    .pnl-bar-right { text-align: right; }
    .pnl-bar-right .pnl-val { font-size: 15px; font-weight: 800; }
    .pnl-bar-right .pnl-pct { font-size: 12px; font-weight: 600; margin-top: 1px; }
    .pnl-val.pos { color: var(--green); }
    .pnl-val.neg { color: var(--red); }
    .pnl-pct.pos { color: var(--green); }
    .pnl-pct.neg { color: var(--red); }

    /* ── シグナル行 ── */
    .signals-row { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .summary-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .summary-pill.STRONG_BUY { background: var(--green); color: #fff; }
    .summary-pill.BUY { background: var(--green-soft); color: var(--green); }
    .summary-pill.NEUTRAL { background: var(--card2); color: var(--text2); }
    .summary-pill.SELL { background: var(--red-soft); color: var(--red); }
    .summary-pill.STRONG_SELL { background: var(--red); color: #fff; }
    .signal-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .signal-tag.buy { background: var(--green-soft); color: var(--green); }
    .signal-tag.sell { background: var(--red-soft); color: var(--red); }
    .signal-tag.alert { background: rgba(255,159,10,0.14); color: var(--orange); }

    /* ── 指標グリッド ── */
    .indicators-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .ind-cell {
      background: var(--card);
      padding: 10px 12px; text-align: center;
    }
    .ind-cell-label { font-size: 10px; color: var(--text2); font-weight: 500; margin-bottom: 3px; }
    .ind-cell-val { font-size: 14px; font-weight: 700; }
    .ind-cell-val.bullish { color: var(--green); }
    .ind-cell-val.bearish { color: var(--red); }
    .ind-cell-val.neutral { color: var(--text3); }

    /* ── アクション行 ── */
    .actions-row {
      display: flex; gap: 8px; padding: 10px 16px 12px;
    }
    .btn-action {
      flex: 1; padding: 8px 0;
      background: var(--card2); border: none; border-radius: 9px;
      font-size: 13px; font-weight: 600; color: var(--text2);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-action:active { opacity: 0.6; }

    /* ── チャート・ニュース ── */
    .chart-wrap { display: none; padding: 4px 12px 12px; }
    .chart-wrap.open { display: block; }
    .chart-period-row { display: flex; gap: 6px; padding: 4px 0 8px; }
    .btn-period {
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 12px;
      font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer;
    }
    .btn-period.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-period:active { opacity: 0.7; }
    .news-wrap { display: none; padding: 0 16px 12px; }
    .news-wrap.open { display: block; }
    .news-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .news-item:last-child { border-bottom: none; }
    .news-title a { font-size: 13px; line-height: 1.4; color: var(--text); text-decoration: none; }
    .news-pub { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ── ポートフォリオサマリーカード ── */
    .summary-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; margin-bottom: 10px;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row-name { font-size: 14px; font-weight: 600; }
    .summary-row-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .summary-row-right { text-align: right; }
    .summary-row-right .mv { font-size: 15px; font-weight: 700; }
    .summary-row-right .pnl-sm { font-size: 12px; font-weight: 700; margin-top: 2px; }
    .pnl-sm.pos { color: var(--green); }
    .pnl-sm.neg { color: var(--red); }

    /* ── スケルトン ── */
    .skeleton {
      background: var(--card2); border-radius: 6px;
      animation: pulse 1.5s ease infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── エラー ── */
    .error-tag { font-size: 12px; color: var(--red); display: flex; align-items: center; gap: 4px; }

    /* ── フッター ── */
    .footer-info {
      text-align: center; font-size: 11px; color: var(--text3);
      padding: 20px 0 8px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">投資ダッシュボード</div>
      <div class="header-sub" id="subtitle">読み込み中...</div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-notify" onclick="requestNotification()" title="通知">🔔</button>
      <button class="btn-refresh-main" id="btn-refresh" onclick="scanAll()">
        <span class="static-icon">↻</span>
        <span class="spin-icon">↻</span>
        <span>更新</span>
      </button>
    </div>
  </div>
</div>

<!-- ヒーロー -->
<div style="max-width:600px;margin:0 auto;">
  <div class="hero" id="hero">
    <div class="hero-label">総資産</div>
    <div class="hero-total" id="hero-total">－</div>
    <div class="hero-pnl" id="hero-pnl"></div>
    <div class="hero-breakdown">
      <div class="hero-item">
        <div class="hero-item-label">日本株</div>
        <div class="hero-item-val" id="hero-jp-val">－</div>
        <div class="hero-item-pnl" id="hero-jp-pnl"></div>
      </div>
      <div class="hero-item">
        <div class="hero-item-label">米国株</div>
        <div class="hero-item-val" id="hero-us-val">－</div>
        <div class="hero-item-pnl" id="hero-us-pnl"></div>
      </div>
      <div class="hero-item">
        <div class="hero-item-label">投信</div>
        <div class="hero-item-val" id="hero-fund-val">－</div>
        <div class="hero-item-pnl" id="hero-fund-pnl"></div>
      </div>
    </div>
  </div>

  <!-- タブ -->
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-stocks" onclick="switchTab('stocks')">株式</button>
      <button class="tab-btn" id="tab-btn-funds" onclick="switchTab('funds')">投信</button>
    </div>
  </div>

  <!-- 株式タブ -->
  <div class="content">
    <div class="tab-panel active" id="tab-stocks">
      <div class="section-label">ウォッチリスト</div>
      <div id="watchlist"></div>
      <div class="section-label">ポートフォリオ</div>
      <div id="portfolio-section"></div>
    </div>

    <!-- 投信タブ -->
    <div class="tab-panel" id="tab-funds">
      <div class="section-label">投資信託</div>
      <div id="funds-section"></div>
    </div>

    <div class="footer-info" id="last-updated"></div>
  </div>
</div>

<script>
  // ── 状態 ─────────────────────────────────────────────
  let watchlist = [];
  let funds = [];
  let scanResults = {};
  let fundResults = {};
  let fxRate = 150;

  const summaryLabels = {
    STRONG_BUY:  '⬆⬆ 強い買い',
    BUY:         '⬆ 買い',
    NEUTRAL:     '━ 中立',
    SELL:        '⬇ 売り',
    STRONG_SELL: '⬇⬇ 強い売り',
  };

  // ── タブ ─────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-btn-${name}`).classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  // ── 初期化 ─────────────────────────────────────────
  async function init() {
    const [wlRes, fRes] = await Promise.all([
      fetch('/api/watchlist'),
      fetch('/api/funds'),
    ]);
    watchlist = (await wlRes.json()).watchlist || [];
    funds = (await fRes.json()).funds || [];
    renderSkeletons();
    // FXレート先取り
    fetch('/api/fx').then(r => r.json()).then(d => {
      fxRate = d.usdjpy || 150;
      renderHero();
    }).catch(() => {});
    scanAll();
  }

  // ── ヒーロー更新 ─────────────────────────────────────
  function renderHero() {
    let mvJP = 0, pnlJP = 0, mvUS = 0, pnlUS = 0;
    let hasJP = false, hasUS = false;

    Object.values(scanResults).forEach(d => {
      if (!d.portfolio) return;
      const p = d.portfolio;
      const isJP = d.symbol.endsWith('.T');
      const currentValue = p.shares * (d.price || 0);
      if (isJP) {
        mvJP += currentValue;
        pnlJP += p.pnl;
        hasJP = true;
      } else {
        mvUS += currentValue;
        pnlUS += p.pnl;
        hasUS = true;
      }
    });

    let mvFund = 0, pnlFund = 0, hasFund = false;
    funds.forEach(f => {
      const fd = fundResults[f.code];
      if (!fd) return;
      const ev = Math.round(fd.price / 10000 * fd.kuchi);
      mvFund += ev;
      pnlFund += (fd.pnl || 0);
      hasFund = true;
    });

    const mvUSJPY = Math.round(mvUS * fxRate);
    const pnlUSJPY = Math.round(pnlUS * fxRate);
    const totalJPY = mvJP + mvUSJPY + mvFund;
    const totalPnl = pnlJP + pnlUSJPY + pnlFund;

    if (totalJPY > 0) {
      document.getElementById('hero-total').textContent = `¥${totalJPY.toLocaleString('ja-JP')}`;
      const pnlEl = document.getElementById('hero-pnl');
      const sign = totalPnl >= 0 ? '+' : '';
      pnlEl.textContent = `${sign}¥${totalPnl.toLocaleString('ja-JP')} 損益`;
      pnlEl.className = `hero-pnl ${totalPnl >= 0 ? 'pos' : 'neg'}`;
    }

    if (hasJP) {
      document.getElementById('hero-jp-val').textContent = `¥${mvJP.toLocaleString('ja-JP')}`;
      const sign = pnlJP >= 0 ? '+' : '';
      const el = document.getElementById('hero-jp-pnl');
      el.textContent = `${sign}¥${pnlJP.toLocaleString('ja-JP')}`;
      el.className = `hero-item-pnl ${pnlJP >= 0 ? 'pos' : 'neg'}`;
    }
    if (hasUS) {
      document.getElementById('hero-us-val').textContent = `¥${mvUSJPY.toLocaleString('ja-JP')}`;
      const sign = pnlUSJPY >= 0 ? '+' : '';
      const el = document.getElementById('hero-us-pnl');
      el.textContent = `${sign}¥${pnlUSJPY.toLocaleString('ja-JP')}`;
      el.className = `hero-item-pnl ${pnlUSJPY >= 0 ? 'pos' : 'neg'}`;
    }
    if (hasFund) {
      document.getElementById('hero-fund-val').textContent = `¥${mvFund.toLocaleString('ja-JP')}`;
      const sign = pnlFund >= 0 ? '+' : '';
      const el = document.getElementById('hero-fund-pnl');
      el.textContent = `${sign}¥${pnlFund.toLocaleString('ja-JP')}`;
      el.className = `hero-item-pnl ${pnlFund >= 0 ? 'pos' : 'neg'}`;
    }
  }

  // ── スケルトン ─────────────────────────────────────
  function renderSkeletons() {
    document.getElementById('watchlist').innerHTML = watchlist.map(w => `
      <div class="card" id="card-${w.symbol}">
        <div class="card-top">
          <div class="card-left">
            <div class="sym-icon ${w.symbol.endsWith('.T') ? 'jp' : 'us'}">${w.symbol.replace('.T','')}</div>
            <div>
              <div class="card-name">${w.name}</div>
              <div class="card-sub">${w.symbol}</div>
            </div>
          </div>
          <div class="card-right">
            <div class="skeleton" style="width:80px;height:22px;margin-bottom:5px"></div>
            <div class="skeleton" style="width:54px;height:15px"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── 全スキャン ─────────────────────────────────────
  const AUTO_REFRESH_MIN = 30;
  let autoRefreshTimer = null;
  let countdownTimer = null;
  let nextRefreshAt = null;

  async function scanAll() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('loading');
    document.getElementById('subtitle').textContent = 'スキャン中...';

    await Promise.allSettled(watchlist.map(w => scanSymbol(w.symbol, w.name)));

    btn.classList.remove('loading');
    const now = new Date().toLocaleTimeString('ja-JP');
    document.getElementById('last-updated').textContent = `最終スキャン: ${now}`;
    renderPortfolio();
    renderFunds();
    renderHero();
    startAutoRefresh();
  }

  function startAutoRefresh() {
    if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    nextRefreshAt = Date.now() + AUTO_REFRESH_MIN * 60 * 1000;
    autoRefreshTimer = setTimeout(() => scanAll(), AUTO_REFRESH_MIN * 60 * 1000);
    countdownTimer = setInterval(() => {
      const rem = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
      const m = Math.floor(rem / 60), s = rem % 60;
      const now = new Date().toLocaleTimeString('ja-JP');
      document.getElementById('subtitle').textContent = `${now}　次回 ${m}:${String(s).padStart(2,'0')}`;
      if (rem === 0) clearInterval(countdownTimer);
    }, 1000);
  }

  // ── 共通チャート描画 ──────────────────────────────
  function makeChart(canvas, chartData, resultData) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)';
    const textColor = '#8E8E93';
    const isUp = resultData && (resultData.change_pct ?? resultData.pnl_pct ?? 0) >= 0;
    const lineColor = isUp ? '#30D158' : '#FF3B30';

    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.offsetHeight || 150);
    grad.addColorStop(0, isUp ? 'rgba(48,209,88,0.22)' : 'rgba(255,59,48,0.22)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    const datasets = [{
      label: '価格',
      data: chartData.closes,
      borderColor: lineColor,
      backgroundColor: grad,
      borderWidth: 2,
      fill: true,
      pointRadius: 0,
      tension: 0.35,
    }];

    if (chartData.sma25?.some(v => v !== null)) {
      datasets.push({
        label: 'SMA25',
        data: chartData.sma25,
        borderColor: 'rgba(255,159,10,0.75)',
        borderWidth: 1.5,
        pointRadius: 0,
        fill: false,
        tension: 0.35,
      });
    }

    if (chartData.avg_cost) {
      datasets.push({
        label: '取得単価',
        data: Array(chartData.dates.length).fill(chartData.avg_cost),
        borderColor: 'rgba(142,142,147,0.5)',
        borderWidth: 1.5,
        borderDash: [5, 4],
        pointRadius: 0,
        fill: false,
      });
    }

    return new Chart(canvas, {
      type: 'line',
      data: { labels: chartData.dates, datasets },
      options: {
        responsive: true,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toLocaleString('ja-JP', {maximumFractionDigits:2})}`,
            }
          }
        },
        scales: {
          x: {
            grid: { color: gridColor },
            ticks: { color: textColor, maxTicksLimit: 6, font: { size: 10 } },
          },
          y: {
            grid: { color: gridColor },
            position: 'right',
            ticks: { color: textColor, font: { size: 10 }, callback: v => v.toLocaleString('ja-JP', {maximumFractionDigits:0}) },
          }
        }
      }
    });
  }

  // ── 通知 ──────────────────────────────────────────
  let notifiedSignals = JSON.parse(localStorage.getItem('notifiedSignals') || '{}');

  async function requestNotification() {
    if (!('Notification' in window)) { alert('このブラウザは通知に対応していません。'); return; }
    const perm = await Notification.requestPermission();
    const btn = document.getElementById('btn-notify');
    if (perm === 'granted') {
      btn.classList.add('active');
      showNotification('投資ダッシュボード', '通知が有効になりました！');
    }
  }

  function showNotification(title, body) {
    if (Notification.permission !== 'granted') return;
    new Notification(title, { body, icon: '/static/icon.png' });
  }

  function checkAndNotify(data) {
    if (Notification.permission !== 'granted') return;
    (data.signals || []).filter(s => s.strength === 'STRONG').forEach(sig => {
      const key = `${data.symbol}_${sig.type}_${sig.reason}`;
      if (!notifiedSignals[key]) {
        notifiedSignals[key] = Date.now();
        localStorage.setItem('notifiedSignals', JSON.stringify(notifiedSignals));
        showNotification(`${data.name} ${sig.type === 'BUY' ? '買いシグナル' : '売りシグナル'}`, sig.reason);
      }
    });
    const cutoff = Date.now() - 86400000;
    Object.keys(notifiedSignals).forEach(k => { if (notifiedSignals[k] < cutoff) delete notifiedSignals[k]; });
  }

  function initNotifyButton() {
    const btn = document.getElementById('btn-notify');
    if (!('Notification' in window)) { btn.style.display = 'none'; return; }
    if (Notification.permission === 'granted') btn.classList.add('active');
  }

  // ── 起動 ──────────────────────────────────────────
  initNotifyButton();
  init();
</script>
</body>
</html>

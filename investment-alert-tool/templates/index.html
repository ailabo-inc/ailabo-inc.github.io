<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>投資ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F2F2F7; --card: #FFFFFF; --card2: #F2F2F7;
      --border: rgba(60,60,67,0.12);
      --text: #1C1C1E; --text2: #8E8E93; --text3: #AEAEB2;
      --green: #30D158; --red: #FF3B30; --orange: #FF9F0A; --blue: #0A84FF; --purple: #BF5AF2;
      --green-soft: rgba(48,209,88,0.14); --red-soft: rgba(255,59,48,0.14); --blue-soft: rgba(10,132,255,0.14);
      --radius: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07); --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --header-bg: rgba(242,242,247,0.82); --nav-bg: rgba(242,242,247,0.88);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E;
        --border: rgba(255,255,255,0.1);
        --text: #FFFFFF; --text2: #8E8E93; --text3: #636366;
        --green-soft: rgba(48,209,88,0.18); --red-soft: rgba(255,59,48,0.18); --blue-soft: rgba(10,132,255,0.18);
        --shadow: 0 2px 12px rgba(0,0,0,0.4); --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
        --header-bg: rgba(0,0,0,0.82); --nav-bg: rgba(28,28,30,0.92);
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E;
      --border: rgba(255,255,255,0.1);
      --text: #FFFFFF; --text2: #8E8E93; --text3: #636366;
      --green-soft: rgba(48,209,88,0.18); --red-soft: rgba(255,59,48,0.18); --blue-soft: rgba(10,132,255,0.18);
      --shadow: 0 2px 12px rgba(0,0,0,0.4); --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --header-bg: rgba(0,0,0,0.82); --nav-bg: rgba(28,28,30,0.92);
    }
    :root[data-theme="light"] {
      --bg: #F2F2F7; --card: #FFFFFF; --card2: #F2F2F7;
      --border: rgba(60,60,67,0.12);
      --text: #1C1C1E; --text2: #8E8E93; --text3: #AEAEB2;
      --green-soft: rgba(48,209,88,0.14); --red-soft: rgba(255,59,48,0.14); --blue-soft: rgba(10,132,255,0.14);
      --shadow: 0 2px 12px rgba(0,0,0,0.07); --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --header-bg: rgba(242,242,247,0.82); --nav-bg: rgba(242,242,247,0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
    }

    /* ── ヘッダー ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px 10px;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--text2); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon {
      width: 34px; height: 34px; border-radius: 17px;
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; box-shadow: var(--shadow);
    }
    .btn-icon.active { background: var(--blue-soft); border-color: var(--blue); }
    .btn-refresh-main {
      height: 34px; border-radius: 17px; padding: 0 16px;
      background: var(--blue); color: #fff; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(10,132,255,0.35);
    }
    .btn-refresh-main:active { opacity: 0.8; }
    .spin-icon { display: none; }
    .btn-refresh-main.loading .spin-icon { display: inline; animation: spin 0.8s linear infinite; }
    .btn-refresh-main.loading .static-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ヒーローセクション ── */
    .hero {
      margin: 16px 16px 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 24px 22px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(10,50,96,0.4);
    }
    .hero::before {
      content: '';
      position: absolute; top: -40%; right: -20%; width: 60%; height: 130%;
      background: radial-gradient(circle, rgba(10,132,255,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-label { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
    .hero-total { font-size: 38px; font-weight: 800; color: #fff; letter-spacing: -1px; line-height: 1.1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
    .hero-pnl { font-size: 15px; font-weight: 600; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
    .hero-pnl.pos { color: #30D158; }
    .hero-pnl.neg { color: #FF3B30; }

    /* アロケーションバー */
    .alloc-bar-wrap { margin-bottom: 14px; }
    .alloc-bar {
      height: 5px; border-radius: 3px;
      background: rgba(255,255,255,0.12);
      display: flex; overflow: hidden;
    }
    .alloc-seg { height: 100%; transition: width 0.5s ease; }
    .alloc-labels { display: flex; justify-content: space-between; margin-top: 6px; }
    .alloc-label { font-size: 10px; color: rgba(255,255,255,0.45); }

    .hero-breakdown {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .hero-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 12px;
    }
    .hero-item-label { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; }
    .hero-item-val { font-size: 14px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .hero-item-pnl { font-size: 11px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .hero-item-pnl.pos { color: #30D158; }
    .hero-item-pnl.neg { color: #FF453A; }

    /* ── コンテンツ ── */
    .content { padding: 0 16px; max-width: 600px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── セクション ── */
    .section-label {
      font-size: 13px; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin: 22px 0 10px 2px;
    }

    /* ── カード ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      padding: 16px 16px 12px;
    }
    .card-left { display: flex; align-items: flex-start; gap: 12px; }
    .sym-icon {
      width: 42px; height: 42px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; line-height: 1.2;
      text-align: center; flex-shrink: 0;
    }
    .sym-icon.jp { background: var(--green-soft); color: var(--green); }
    .sym-icon.us { background: var(--blue-soft); color: var(--blue); }
    .sym-icon.fund { background: var(--blue-soft); color: var(--blue); font-size: 10px; }
    .card-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .card-right { text-align: right; flex-shrink: 0; }
    .card-price { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .card-change { font-size: 13px; font-weight: 700; margin-top: 2px; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    /* ── スパークライン ── */
    .spark-wrap { margin: -4px 16px 8px; }

    /* ── P&Lバー ── */
    .pnl-bar {
      margin: 0 16px 12px;
      background: var(--card2);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pnl-bar-left { font-size: 12px; color: var(--text2); }
    .pnl-bar-left strong { font-size: 13px; font-weight: 700; color: var(--text); }
    .pnl-bar-right { text-align: right; }
    .pnl-bar-right .pnl-val { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pnl-bar-right .pnl-pct { font-size: 12px; font-weight: 600; margin-top: 1px; }
    .pnl-val.pos { color: var(--green); }
    .pnl-val.neg { color: var(--red); }
    .pnl-pct.pos { color: var(--green); }
    .pnl-pct.neg { color: var(--red); }

    /* ── シグナル行 ── */
    .signals-row { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .summary-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .summary-pill.STRONG_BUY { background: var(--green); color: #fff; }
    .summary-pill.BUY { background: var(--green-soft); color: var(--green); }
    .summary-pill.NEUTRAL { background: var(--card2); color: var(--text2); }
    .summary-pill.SELL { background: var(--red-soft); color: var(--red); }
    .summary-pill.STRONG_SELL { background: var(--red); color: #fff; }
    .signal-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .signal-tag.buy { background: var(--green-soft); color: var(--green); }
    .signal-tag.sell { background: var(--red-soft); color: var(--red); }
    .signal-tag.alert { background: rgba(255,159,10,0.14); color: var(--orange); }

    /* ── 指標チップ ── */
    .ind-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
    .ind-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .ind-chip .chip-label { font-size: 10px; font-weight: 600; opacity: 0.7; }
    .ind-chip.bullish { background: var(--green-soft); color: var(--green); }
    .ind-chip.bearish { background: var(--red-soft); color: var(--red); }
    .ind-chip.neutral { background: var(--card2); color: var(--text2); }

    /* ── アクション行 ── */
    .actions-row {
      display: flex; gap: 8px; padding: 0 16px 12px;
    }
    .btn-action {
      flex: 1; padding: 9px 0;
      background: var(--card2); border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: var(--text2);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-action:active { opacity: 0.6; }
    .btn-action.active { background: var(--blue-soft); color: var(--blue); }

    /* ── チャート・ニュース（CSS gridアニメーション） ── */
    .chart-wrap, .news-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s ease;
    }
    .chart-wrap.open, .news-wrap.open { grid-template-rows: 1fr; }
    .chart-inner, .news-inner { overflow: hidden; min-height: 0; }
    .chart-inner { padding: 0 12px 12px; }
    .news-inner { padding: 0 16px 12px; }
    .chart-period-row { display: flex; gap: 6px; padding: 4px 0 8px; }
    .btn-period {
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 12px;
      font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer;
    }
    .btn-period.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-period:active { opacity: 0.7; }
    .news-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .news-item:last-child { border-bottom: none; }
    .news-title a { font-size: 13px; line-height: 1.4; color: var(--text); text-decoration: none; }
    .news-pub { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ── ポートフォリオサマリーカード ── */
    .summary-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; margin-bottom: 10px;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row-name { font-size: 14px; font-weight: 600; }
    .summary-row-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .summary-row-right { text-align: right; }
    .summary-row-right .mv { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .summary-row-right .pnl-sm { font-size: 12px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .pnl-sm.pos { color: var(--green); }
    .pnl-sm.neg { color: var(--red); }

    /* ── スケルトン ── */
    .skeleton {
      background: var(--card2); border-radius: 6px;
      animation: pulse 1.5s ease infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── エラー ── */
    .error-tag { font-size: 12px; color: var(--red); display: flex; align-items: center; gap: 4px; }

    /* ── フッター ── */
    .footer-info {
      text-align: center; font-size: 11px; color: var(--text3);
      padding: 20px 0 8px;
    }

    /* ── ソートバー ── */
    .sort-bar { display: flex; gap: 6px; padding: 0 0 12px; flex-wrap: wrap; }
    .btn-sort {
      padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: none; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sort.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-sort.buy-filter.active { background: var(--green); border-color: var(--green); }

    /* ── 投信合計カード ── */
    .fund-total-card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; margin-bottom: 12px;
    }
    .fund-total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
    .fund-total-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 3px; }
    .fund-total-val { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .fund-total-bar-wrap { background: var(--card2); border-radius: 4px; height: 6px; overflow: hidden; }
    .fund-total-bar-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width 0.6s ease; }
    .fund-total-meta { font-size: 11px; color: var(--text2); margin-top: 6px; }

    /* ── プルトゥリフレッシュ ── */
    .ptr-wrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      display: flex; justify-content: center;
      pointer-events: none;
    }
    .ptr-pill {
      margin-top: calc(env(safe-area-inset-top, 0px) + 52px);
      background: var(--card); border-radius: 20px;
      padding: 6px 14px; box-shadow: var(--shadow-lg);
      font-size: 12px; font-weight: 600; color: var(--text2);
      display: flex; align-items: center; gap: 6px;
      transform: translateY(-60px) scale(0.85);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .ptr-pill.visible { transform: translateY(0) scale(1); opacity: 1; }
    .ptr-pill .ptr-icon { font-size: 15px; display: inline-block; transition: transform 0.2s; }
    .ptr-pill.ready .ptr-icon { transform: rotate(180deg); }
    .ptr-pill.refreshing .ptr-icon { animation: spin 0.7s linear infinite; }

    /* ── ボトムナビ ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: var(--nav-bg);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 0 0 env(safe-area-inset-bottom, 0px);
    }
    .nav-btn {
      flex: 1; border: none; background: none;
      padding: 10px 0 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--text3); transition: color 0.15s;
    }
    .nav-btn.active { color: var(--blue); }
    .nav-btn:active { opacity: 0.6; }
    .nav-btn-icon { font-size: 22px; line-height: 1; }
    .nav-btn-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1px; }
  </style>
</head>
<body>

<div class="ptr-wrap"><div class="ptr-pill" id="ptr-pill"><span class="ptr-icon">↓</span><span id="ptr-text">引いて更新</span></div></div>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">投資ダッシュボード</div>
      <div class="header-sub" id="subtitle">読み込み中...</div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-theme" onclick="toggleTheme()" title="テーマ">🌓</button>
      <button class="btn-icon" id="btn-notify" onclick="requestNotification()" title="通知">🔔</button>
      <button class="btn-refresh-main" id="btn-refresh" onclick="scanAll()">
        <span class="static-icon">↻</span>
        <span class="spin-icon">↻</span>
        <span>更新</span>
      </button>
    </div>
  </div>
</div>

<!-- ヒーロー -->
<div style="max-width:600px;margin:0 auto;">
  <div class="hero" id="hero">
    <div class="hero-label">総資産</div>
    <div class="hero-total" id="hero-total">－</div>
    <div class="hero-pnl" id="hero-pnl"></div>
    <div class="alloc-bar-wrap" id="alloc-bar-wrap" style="display:none">
      <div class="alloc-bar" id="alloc-bar"></div>
      <div class="alloc-labels" id="alloc-labels"></div>
    </div>
    <div class="hero-breakdown">
      <div class="hero-item">
        <div class="hero-item-label">日本株</div>
        <div class="hero-item-val" id="hero-jp-val">－</div>
        <div class="hero-item-pnl" id="hero-jp-pnl"></div>
      </div>
      <div class="hero-item">
        <div class="hero-item-label">米国株</div>
        <div class="hero-item-val" id="hero-us-val">－</div>
        <div class="hero-item-pnl" id="hero-us-pnl"></div>
      </div>
      <div class="hero-item">
        <div class="hero-item-label">投信</div>
        <div class="hero-item-val" id="hero-fund-val">－</div>
        <div class="hero-item-pnl" id="hero-fund-pnl"></div>
      </div>
    </div>
  </div>

  <!-- コンテンツ -->
  <div class="content">
    <div class="tab-panel active" id="tab-stocks">
      <div class="section-label">ウォッチリスト</div>
      <div class="sort-bar">
        <button class="btn-sort active" data-sort="default" onclick="setSortBy('default')">デフォルト</button>
        <button class="btn-sort" data-sort="change" onclick="setSortBy('change')">変化率↓</button>
        <button class="btn-sort" data-sort="pnl" onclick="setSortBy('pnl')">損益率↓</button>
        <button class="btn-sort buy-filter" id="btn-filter-buy" onclick="toggleFilterBuy()">🔼 買いのみ</button>
      </div>
      <div id="watchlist"></div>
      <div class="section-label">ポートフォリオ</div>
      <div id="portfolio-section"></div>
    </div>

    <div class="tab-panel" id="tab-funds">
      <div class="section-label">投資信託</div>
      <div id="fund-total-summary"></div>
      <div id="funds-section"></div>
    </div>

    <div class="footer-info" id="last-updated"></div>
  </div>
</div>

<!-- ボトムナビゲーション -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-btn-stocks" onclick="switchTab('stocks')">
    <div class="nav-btn-icon">📈</div>
    <div class="nav-btn-label">株式</div>
  </button>
  <button class="nav-btn" id="nav-btn-funds" onclick="switchTab('funds')">
    <div class="nav-btn-icon">🏦</div>
    <div class="nav-btn-label">投信</div>
  </button>
</div>

<script>
  // ── 状態 ─────────────────────────────────────────────
  let watchlist = [];
  let funds = [];
  let scanResults = {};
  let fundResults = {};
  let fxRate = 150;

  const summaryLabels = {
    STRONG_BUY:  '⬆⬆ 強い買い',
    BUY:         '⬆ 買い',
    NEUTRAL:     '━ 中立',
    SELL:        '⬇ 売り',
    STRONG_SELL: '⬇⬇ 強い売り',
  };

  // ── タブ ─────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`nav-btn-${name}`).classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  // ── 初期化 ─────────────────────────────────────────
  async function init() {
    const [wlRes, fRes] = await Promise.all([
      fetch('/api/watchlist'),
      fetch('/api/funds'),
    ]);
    watchlist = (await wlRes.json()).watchlist || [];
    funds = (await fRes.json()).funds || [];
    renderSkeletons();
    fetch('/api/fx').then(r => r.json()).then(d => {
      fxRate = d.usdjpy || 150;
      renderHero();
    }).catch(() => {});
    scanAll();
  }

  // ── スパークライン SVG ────────────────────────────────
  function makeSpark(closes, isUp) {
    if (!closes || closes.length < 3) return '';
    const pts = closes.slice(-45);
    const lo = Math.min(...pts), hi = Math.max(...pts);
    const range = hi - lo || 1;
    const w = 300, h = 48, px = 2, py = 5;
    const xs = pts.map((_, i) => px + i / (pts.length - 1) * (w - px * 2));
    const ys = pts.map(v => py + (1 - (v - lo) / range) * (h - py * 2));
    const lineD = xs.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const areaD = `M${xs[0].toFixed(1)},${h} ${xs.map((x, i) => `L${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ')} L${xs[xs.length-1].toFixed(1)},${h}Z`;
    const c = isUp ? '#30D158' : '#FF3B30';
    const f = isUp ? 'rgba(48,209,88,0.10)' : 'rgba(255,59,48,0.10)';
    const lx = xs[xs.length-1].toFixed(1), ly = ys[ys.length-1].toFixed(1);
    return `<div class="spark-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:48px">
      <path d="${areaD}" fill="${f}"/>
      <path d="${lineD}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lx}" cy="${ly}" r="2.5" fill="${c}"/>
    </svg></div>`;
  }

  // ── ヒーロー更新 ─────────────────────────────────────
  function renderHero() {
    let mvJP = 0, pnlJP = 0, mvUS = 0, pnlUS = 0;
    let hasJP = false, hasUS = false;

    Object.values(scanResults).forEach(d => {
      if (!d.portfolio) return;
      const p = d.portfolio;
      const isJP = d.symbol.endsWith('.T');
      const currentValue = p.shares * (d.price || 0);
      if (isJP) { mvJP += currentValue; pnlJP += p.pnl; hasJP = true; }
      else { mvUS += currentValue; pnlUS += p.pnl; hasUS = true; }
    });

    let mvFund = 0, pnlFund = 0, hasFund = false;
    funds.forEach(f => {
      const fd = fundResults[f.code];
      if (!fd) return;
      const ev = Math.round(fd.price / 10000 * fd.kuchi);
      mvFund += ev;
      pnlFund += (fd.pnl || 0);
      hasFund = true;
    });

    const mvUSJPY = Math.round(mvUS * fxRate);
    const pnlUSJPY = Math.round(pnlUS * fxRate);
    const totalJPY = mvJP + mvUSJPY + mvFund;
    const totalPnl = pnlJP + pnlUSJPY + pnlFund;

    if (totalJPY > 0) {
      countUp(document.getElementById('hero-total'), totalJPY);
      const pnlEl = document.getElementById('hero-pnl');
      const sign = totalPnl >= 0 ? '+' : '';
      pnlEl.textContent = `${sign}¥${totalPnl.toLocaleString('ja-JP')} 損益`;
      pnlEl.className = `hero-pnl ${totalPnl >= 0 ? 'pos' : 'neg'}`;

      // アロケーションバー
      const total = mvJP + mvUSJPY + mvFund;
      if (total > 0) {
        const pJP = mvJP / total * 100, pUS = mvUSJPY / total * 100, pFund = mvFund / total * 100;
        document.getElementById('alloc-bar').innerHTML = `
          <div class="alloc-seg" style="width:${pJP.toFixed(1)}%;background:#30D158"></div>
          <div class="alloc-seg" style="width:${pUS.toFixed(1)}%;background:#0A84FF;margin-left:2px"></div>
          <div class="alloc-seg" style="width:${pFund.toFixed(1)}%;background:#BF5AF2;margin-left:2px"></div>`;
        document.getElementById('alloc-labels').innerHTML = `
          <span class="alloc-label">JP ${pJP.toFixed(0)}%</span>
          <span class="alloc-label">US ${pUS.toFixed(0)}%</span>
          <span class="alloc-label">投信 ${pFund.toFixed(0)}%</span>`;
        document.getElementById('alloc-bar-wrap').style.display = 'block';
      }
    }

    if (hasJP) {
      document.getElementById('hero-jp-val').textContent = `¥${mvJP.toLocaleString('ja-JP')}`;
      const el = document.getElementById('hero-jp-pnl');
      el.textContent = `${pnlJP >= 0 ? '+' : ''}¥${pnlJP.toLocaleString('ja-JP')}`;
      el.className = `hero-item-pnl ${pnlJP >= 0 ? 'pos' : 'neg'}`;
    }
    if (hasUS) {
      document.getElementById('hero-us-val').textContent = `¥${mvUSJPY.toLocaleString('ja-JP')}`;
      const el = document.getElementById('hero-us-pnl');
      el.textContent = `${pnlUSJPY >= 0 ? '+' : ''}¥${pnlUSJPY.toLocaleString('ja-JP')}`;
      el.className = `hero-item-pnl ${pnlUSJPY >= 0 ? 'pos' : 'neg'}`;
    }
    if (hasFund) {
      document.getElementById('hero-fund-val').textContent = `¥${mvFund.toLocaleString('ja-JP')}`;
      const el = document.getElementById('hero-fund-pnl');
      el.textContent = `${pnlFund >= 0 ? '+' : ''}¥${pnlFund.toLocaleString('ja-JP')}`;
      el.className = `hero-item-pnl ${pnlFund >= 0 ? 'pos' : 'neg'}`;
    }
  }

  // ── スケルトン ─────────────────────────────────────
  function renderSkeletons() {
    document.getElementById('watchlist').innerHTML = watchlist.map(w => `
      <div class="card" id="card-${w.symbol}">
        <div class="card-top">
          <div class="card-left">
            <div class="sym-icon ${w.symbol.endsWith('.T') ? 'jp' : 'us'}">${w.symbol.replace('.T','')}</div>
            <div>
              <div class="card-name">${w.name}</div>
              <div class="card-sub">${w.symbol}</div>
            </div>
          </div>
          <div class="card-right">
            <div class="skeleton" style="width:80px;height:22px;margin-bottom:5px"></div>
            <div class="skeleton" style="width:54px;height:15px"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── 全スキャン ─────────────────────────────────────
  const AUTO_REFRESH_MIN = 30;
  let autoRefreshTimer = null;
  let countdownTimer = null;
  let nextRefreshAt = null;

  async function scanAll() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('loading');
    document.getElementById('subtitle').textContent = 'スキャン中...';

    await Promise.allSettled(watchlist.map(w => scanSymbol(w.symbol, w.name)));

    btn.classList.remove('loading');
    const now = new Date().toLocaleTimeString('ja-JP');
    document.getElementById('last-updated').textContent = `最終スキャン: ${now}`;
    renderPortfolio();
    renderFunds();
    renderHero();
    startAutoRefresh();
  }

  function startAutoRefresh() {
    if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    nextRefreshAt = Date.now() + AUTO_REFRESH_MIN * 60 * 1000;
    autoRefreshTimer = setTimeout(() => scanAll(), AUTO_REFRESH_MIN * 60 * 1000);
    countdownTimer = setInterval(() => {
      const rem = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
      const m = Math.floor(rem / 60), s = rem % 60;
      const now = new Date().toLocaleTimeString('ja-JP');
      document.getElementById('subtitle').textContent = `${now}　次回 ${m}:${String(s).padStart(2,'0')}`;
      if (rem === 0) clearInterval(countdownTimer);
    }, 1000);
  }

  // ── 1銘柄スキャン ──────────────────────────────────
  async function scanSymbol(symbol, name) {
    try {
      const res = await fetch(`/api/scan/${symbol}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      scanResults[symbol] = data;
      renderCard(data);
      checkAndNotify(data);
      applySortFilter();
    } catch (e) {
      renderCardError(symbol, name, e.message);
    }
  }

  // ── 株式カード ─────────────────────────────────────
  function renderCard(d) {
    const card = document.getElementById(`card-${d.symbol}`);
    if (!card) return;
    const isJP = d.symbol.endsWith('.T');
    const upDown = d.change_pct >= 0;
    const changeClass = upDown ? 'up' : 'down';
    const arrow = upDown ? '▲' : '▼';
    const iconCls = isJP ? 'jp' : 'us';

    const rsiColor = d.rsi == null ? 'neutral' : d.rsi > 70 ? 'bearish' : d.rsi < 30 ? 'bullish' : 'neutral';
    const rsiText = d.rsi != null ? d.rsi.toFixed(1) : '--';
    const macdBull = d.macd != null && d.macd_signal != null && d.macd > d.macd_signal;
    const macdColor = d.macd == null ? 'neutral' : macdBull ? 'bullish' : 'bearish';
    const macdText = d.macd == null ? '--' : macdBull ? '↑ 強気' : '↓ 弱気';
    const smaBull = d.sma5 != null && d.sma25 != null && d.sma5 > d.sma25;
    const smaColor = d.sma5 == null ? 'neutral' : smaBull ? 'bullish' : 'bearish';
    const smaText = d.sma5 == null ? '--' : smaBull ? '↑ 上昇' : '↓ 下降';

    let pnlHtml = '';
    if (d.portfolio) {
      const p = d.portfolio;
      const cls = p.pnl >= 0 ? 'pos' : 'neg';
      const pnlSign = p.pnl >= 0 ? '+' : '-';
      const pnlAmt = isJP
        ? `¥${Math.abs(p.pnl).toLocaleString('ja-JP', {maximumFractionDigits:0})}`
        : `$${Math.abs(p.pnl).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
      const costStr = isJP ? `¥${p.avg_cost.toLocaleString('ja-JP')}` : `$${p.avg_cost}`;
      pnlHtml = `
        <div class="pnl-bar">
          <div class="pnl-bar-left">
            <strong>${p.shares}株</strong>
            <span> @ ${costStr}</span>
          </div>
          <div class="pnl-bar-right">
            <div class="pnl-val ${cls}">${pnlSign}${pnlAmt}</div>
            <div class="pnl-pct ${cls}">${p.pnl_pct >= 0 ? '+' : ''}${p.pnl_pct}%</div>
          </div>
        </div>`;
    }

    const summaryBadge = d.summary
      ? `<span class="summary-pill ${d.summary}">${summaryLabels[d.summary] || d.summary}</span>` : '';
    const signalsHtml = d.signals.length
      ? d.signals.map(s => {
          const cls = s.type === 'BUY' ? 'buy' : s.type === 'SELL' ? 'sell' : 'alert';
          return `<span class="signal-tag ${cls}">${s.reason}</span>`;
        }).join('')
      : `<span style="font-size:12px;color:var(--text3)">シグナルなし</span>`;

    const sparkHtml = d.chart?.closes ? makeSpark(d.chart.closes, upDown) : '';
    const changeAbs = Math.abs(d.price * d.change_pct / (100 + d.change_pct));
    const changeAbsStr = isJP
      ? `¥${Math.round(changeAbs).toLocaleString('ja-JP')}`
      : `$${changeAbs.toFixed(2)}`;
    const cachedLabel = d.cached && d.fetched_at ? ` · ${d.fetched_at} 時点` : d.cached ? ' · 前回データ' : '';

    card.innerHTML = `
      <div class="card-top">
        <div class="card-left">
          <div class="sym-icon ${iconCls}">${d.symbol.replace('.T','')}</div>
          <div>
            <div class="card-name">${d.name}</div>
            <div class="card-sub">${d.symbol}${cachedLabel}</div>
          </div>
        </div>
        <div class="card-right">
          <div class="card-price">${Number(d.price).toLocaleString('ja-JP', {maximumFractionDigits:2})}</div>
          <div class="card-change ${changeClass}">${arrow} ${changeAbsStr} / ${Math.abs(d.change_pct).toFixed(2)}%</div>
        </div>
      </div>
      ${sparkHtml}
      ${pnlHtml}
      <div class="signals-row">${summaryBadge}${signalsHtml}</div>
      <div class="ind-chips">
        <span class="ind-chip ${rsiColor}"><span class="chip-label">RSI</span> ${rsiText}</span>
        <span class="ind-chip ${macdColor}"><span class="chip-label">MACD</span> ${macdText}</span>
        <span class="ind-chip ${smaColor}"><span class="chip-label">トレンド</span> ${smaText}</span>
      </div>
      <div class="actions-row">
        <button class="btn-action" id="btn-news-${d.symbol}" onclick="toggleNews('${d.symbol}')">📰 ニュース</button>
        <button class="btn-action" id="btn-chart-${d.symbol}" onclick="toggleChart('${d.symbol}')">📊 チャート</button>
      </div>
      <div class="news-wrap" id="news-${d.symbol}">
        <div class="news-inner">
          <div style="font-size:12px;color:var(--text2);padding:4px 0">読み込み中...</div>
        </div>
      </div>
      <div class="chart-wrap" id="chart-${d.symbol}">
        <div class="chart-inner">
          <div class="chart-period-row" id="periods-${d.symbol}">
            <button class="btn-period active" data-period="3mo" onclick="changeChartPeriod('${d.symbol}','3mo')">3ヶ月</button>
            <button class="btn-period" data-period="1y" onclick="changeChartPeriod('${d.symbol}','1y')">1年</button>
            <button class="btn-period" data-period="3y" onclick="changeChartPeriod('${d.symbol}','3y')">3年</button>
          </div>
          <div id="chart-loading-${d.symbol}" style="display:none;text-align:center;font-size:12px;color:var(--text2);padding:6px 0">読み込み中...</div>
          <canvas id="canvas-${d.symbol}" height="150"></canvas>
        </div>
      </div>
    `;
  }

  function renderCardError(symbol, name, message) {
    const card = document.getElementById(`card-${symbol}`);
    if (!card) return;
    const isJP = symbol.endsWith('.T');
    card.innerHTML = `
      <div class="card-top">
        <div class="card-left">
          <div class="sym-icon ${isJP ? 'jp' : 'us'}">${symbol.replace('.T','')}</div>
          <div>
            <div class="card-name">${name}</div>
            <div class="card-sub">${symbol}</div>
          </div>
        </div>
        <div class="card-right"><span class="error-tag">⚠ 取得失敗</span></div>
      </div>`;
  }

  // ── ポートフォリオサマリー ──────────────────────────
  function renderPortfolio() {
    const section = document.getElementById('portfolio-section');
    const hasPortfolio = Object.values(scanResults).some(d => d.portfolio);
    if (!hasPortfolio) {
      section.innerHTML = '<p style="font-size:13px;color:var(--text2);padding:4px 2px">PORTFOLIO に保有株を設定すると表示されます</p>';
      return;
    }

    let mvJP = 0, pnlJP = 0, mvUS = 0, pnlUS = 0;
    const rows = [];

    Object.values(scanResults).forEach(d => {
      if (!d.portfolio) return;
      const p = d.portfolio;
      const isJP = d.symbol.endsWith('.T');
      const mv = p.shares * (d.price || 0);
      if (isJP) { mvJP += mv; pnlJP += p.pnl; }
      else { mvUS += mv; pnlUS += p.pnl; }

      const cls = p.pnl >= 0 ? 'pos' : 'neg';
      const pnlStr = isJP
        ? `¥${Math.abs(p.pnl).toLocaleString('ja-JP',{maximumFractionDigits:0})}`
        : `$${Math.abs(p.pnl).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
      const mvStr = isJP
        ? `¥${mv.toLocaleString('ja-JP',{maximumFractionDigits:0})}`
        : `$${mv.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
      rows.push(`
        <div class="summary-row">
          <div>
            <div class="summary-row-name">${d.name}</div>
            <div class="summary-row-sub">${p.shares}株</div>
          </div>
          <div class="summary-row-right">
            <div class="mv">${mvStr}</div>
            <div class="pnl-sm ${cls}">${p.pnl >= 0 ? '+' : '-'}${pnlStr} (${p.pnl_pct >= 0 ? '+' : ''}${p.pnl_pct}%)</div>
          </div>
        </div>`);
    });

    const jpCls = pnlJP >= 0 ? 'pos' : 'neg';
    const usCls = pnlUS >= 0 ? 'pos' : 'neg';
    const mvUSJPY = Math.round(mvUS * fxRate);
    const pnlUSJPY = Math.round(pnlUS * fxRate);

    section.innerHTML = `
      <div class="summary-card">
        ${rows.join('')}
        <div class="summary-row">
          <div><div class="summary-row-name">国内株 合計</div></div>
          <div class="summary-row-right">
            <div class="mv">¥${mvJP.toLocaleString('ja-JP',{maximumFractionDigits:0})}</div>
            <div class="pnl-sm ${jpCls}">${pnlJP >= 0 ? '+' : '-'}¥${Math.abs(pnlJP).toLocaleString('ja-JP',{maximumFractionDigits:0})}</div>
          </div>
        </div>
        <div class="summary-row">
          <div>
            <div class="summary-row-name">米国株 合計</div>
            <div class="summary-row-sub" id="fx-rate-label">1USD = ¥${fxRate.toFixed(1)}</div>
          </div>
          <div class="summary-row-right">
            <div class="mv">¥${mvUSJPY.toLocaleString('ja-JP')}</div>
            <div class="pnl-sm ${usCls}">${pnlUSJPY >= 0 ? '+' : '-'}¥${Math.abs(pnlUSJPY).toLocaleString('ja-JP')}</div>
          </div>
        </div>
      </div>`;
  }

  // ── 投資信託 ───────────────────────────────────────
  const fundChartInstances = {};
  const currentFundChartPeriod = {};

  function renderFunds() {
    const section = document.getElementById('funds-section');
    if (!funds.length) { section.innerHTML = ''; return; }
    section.innerHTML = funds.map(f => `
      <div class="card" id="fund-card-${f.code}">
        <div class="card-top">
          <div class="card-left">
            <div class="sym-icon fund">投信</div>
            <div>
              <div class="card-name">${f.name}</div>
              <div class="card-sub">${f.kuchi.toLocaleString('ja-JP')}口</div>
            </div>
          </div>
          <div class="card-right">
            <div class="skeleton" style="width:90px;height:22px;margin-bottom:5px"></div>
            <div class="skeleton" style="width:55px;height:15px"></div>
          </div>
        </div>
      </div>`).join('');
    funds.forEach(f => loadFund(f.code));
  }

  async function loadFund(code) {
    try {
      const res = await fetch(`/api/fund-scan/${code}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      fundResults[code] = data;
      renderFundCard(data);
      renderHero();
      renderFundTotal();
    } catch (e) {
      renderFundCardError(code, e.message);
    }
  }

  function renderFundCard(d) {
    const card = document.getElementById(`fund-card-${d.code}`);
    if (!card) return;
    const upDown = d.change_pct >= 0;
    const changeClass = upDown ? 'up' : 'down';
    const arrow = upDown ? '▲' : '▼';
    const pnlCls = d.pnl >= 0 ? 'pos' : 'neg';
    const evalPrice = Math.round(d.price / 10000 * d.kuchi);
    const sparkHtml = d.chart?.closes ? makeSpark(d.chart.closes, upDown) : '';
    const fundChangeAbs = Math.abs(Math.round(d.price * d.change_pct / (100 + d.change_pct)));
    const fundCachedLabel = d.cached && d.fetched_at ? ` · ${d.fetched_at} 時点` : '';

    card.innerHTML = `
      <div class="card-top">
        <div class="card-left">
          <div class="sym-icon fund">投信</div>
          <div>
            <div class="card-name">${d.name}</div>
            <div class="card-sub">${d.kuchi.toLocaleString('ja-JP')}口${fundCachedLabel}</div>
          </div>
        </div>
        <div class="card-right">
          <div class="card-price">${Number(d.price).toLocaleString('ja-JP')}円</div>
          <div class="card-change ${changeClass}">${arrow} ¥${fundChangeAbs} / ${Math.abs(d.change_pct).toFixed(2)}%</div>
        </div>
      </div>
      ${sparkHtml}
      <div class="pnl-bar">
        <div class="pnl-bar-left">
          <strong>評価額</strong> ¥${evalPrice.toLocaleString('ja-JP')}
          <span style="margin-left:6px;color:var(--text3);font-size:11px">取得 ¥${Number(d.avg_cost).toLocaleString('ja-JP')}</span>
        </div>
        <div class="pnl-bar-right">
          <div class="pnl-val ${pnlCls}">${d.pnl >= 0 ? '+' : '-'}¥${Math.abs(d.pnl).toLocaleString('ja-JP',{maximumFractionDigits:0})}</div>
          <div class="pnl-pct ${pnlCls}">${d.pnl_pct >= 0 ? '+' : ''}${d.pnl_pct}%</div>
        </div>
      </div>
      <div class="actions-row">
        <button class="btn-action" id="btn-fchart-${d.code}" onclick="toggleFundChart('${d.code}')">📊 チャート</button>
      </div>
      <div class="chart-wrap" id="fund-chart-${d.code}">
        <div class="chart-inner">
          <div class="chart-period-row" id="fund-periods-${d.code}">
            <button class="btn-period active" data-period="3mo" onclick="changeFundChartPeriod('${d.code}','3mo')">3ヶ月</button>
            <button class="btn-period" data-period="1y" onclick="changeFundChartPeriod('${d.code}','1y')">1年</button>
            <button class="btn-period" data-period="3y" onclick="changeFundChartPeriod('${d.code}','3y')">3年</button>
          </div>
          <div id="fund-chart-loading-${d.code}" style="display:none;text-align:center;font-size:12px;color:var(--text2);padding:6px 0">読み込み中...</div>
          <canvas id="fund-canvas-${d.code}" height="150"></canvas>
        </div>
      </div>`;
  }

  function renderFundCardError(code, message) {
    const fund = funds.find(f => f.code === code);
    const card = document.getElementById(`fund-card-${code}`);
    if (!card) return;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-left">
          <div class="sym-icon fund">投信</div>
          <div>
            <div class="card-name">${fund ? fund.name : code}</div>
            <div class="card-sub">${fund ? fund.kuchi.toLocaleString('ja-JP') : ''}口</div>
          </div>
        </div>
        <div class="card-right"><span class="error-tag">⚠ 取得失敗</span></div>
      </div>
      <div style="padding:4px 16px 12px;font-size:12px;color:var(--text2)">
        取得金額: ¥${fund ? fund.cost.toLocaleString('ja-JP') : '---'}（SBIで確認ください）
      </div>`;
  }

  function toggleFundChart(code) {
    const c = document.getElementById(`fund-chart-${code}`);
    const btn = document.getElementById(`btn-fchart-${code}`);
    if (!c) return;
    const open = c.classList.toggle('open');
    if (btn) btn.classList.toggle('active', open);
    if (open && !fundChartInstances[code]) renderFundChart(code, currentFundChartPeriod[code] || '3mo');
  }

  async function changeFundChartPeriod(code, period) {
    currentFundChartPeriod[code] = period;
    const row = document.getElementById(`fund-periods-${code}`);
    if (row) row.querySelectorAll('.btn-period').forEach(b => b.classList.toggle('active', b.dataset.period === period));
    if (fundChartInstances[code]) { fundChartInstances[code].destroy(); delete fundChartInstances[code]; }
    await renderFundChart(code, period);
  }

  async function renderFundChart(code, period = '3mo') {
    const canvas = document.getElementById(`fund-canvas-${code}`);
    if (!canvas) return;
    let chartData;
    if (period === '3mo' && fundResults[code]?.chart) {
      const d = fundResults[code];
      chartData = { dates: d.chart.dates, closes: d.chart.closes, avg_cost: d.avg_cost };
    } else {
      const loadEl = document.getElementById(`fund-chart-loading-${code}`);
      if (loadEl) loadEl.style.display = 'block';
      canvas.style.opacity = '0.3';
      try {
        const res = await fetch(`/api/fund-chart/${code}/${period}`);
        const data = await res.json();
        if (loadEl) loadEl.style.display = 'none';
        canvas.style.opacity = '1';
        if (data.error) return;
        chartData = data.chart;
      } catch(e) {
        const el = document.getElementById(`fund-chart-loading-${code}`);
        if (el) el.style.display = 'none';
        canvas.style.opacity = '1';
        return;
      }
    }
    fundChartInstances[code] = makeChart(canvas, chartData, fundResults[code]);
  }

  // ── ニュース ───────────────────────────────────────
  const newsLoaded = {};
  async function toggleNews(symbol) {
    const c = document.getElementById(`news-${symbol}`);
    const btn = document.getElementById(`btn-news-${symbol}`);
    if (!c) return;
    const open = c.classList.toggle('open');
    if (btn) btn.classList.toggle('active', open);
    if (!open || newsLoaded[symbol]) return;
    newsLoaded[symbol] = true;
    try {
      const res = await fetch(`/api/news/${symbol}`);
      const data = await res.json();
      const inner = c.querySelector('.news-inner');
      if (!data.news?.length) {
        inner.innerHTML = '<div style="font-size:12px;color:var(--text2);padding:4px 0">ニュースが見つかりません</div>';
        return;
      }
      inner.innerHTML = data.news.map(n => `
        <div class="news-item">
          <div class="news-title"><a href="${n.link}" target="_blank">${n.title}</a></div>
          <div class="news-pub">${n.pub}</div>
        </div>`).join('');
    } catch(e) {
      const inner = c.querySelector('.news-inner');
      if (inner) inner.innerHTML = '<div style="font-size:12px;color:var(--red);padding:4px 0">取得失敗</div>';
    }
  }

  // ── チャート ───────────────────────────────────────
  const chartInstances = {};
  const currentChartPeriod = {};

  function toggleChart(symbol) {
    const c = document.getElementById(`chart-${symbol}`);
    const btn = document.getElementById(`btn-chart-${symbol}`);
    if (!c) return;
    const open = c.classList.toggle('open');
    if (btn) btn.classList.toggle('active', open);
    if (open && !chartInstances[symbol]) renderChart(symbol, currentChartPeriod[symbol] || '3mo');
  }

  async function changeChartPeriod(symbol, period) {
    currentChartPeriod[symbol] = period;
    const row = document.getElementById(`periods-${symbol}`);
    if (row) row.querySelectorAll('.btn-period').forEach(b => b.classList.toggle('active', b.dataset.period === period));
    if (chartInstances[symbol]) { chartInstances[symbol].destroy(); delete chartInstances[symbol]; }
    await renderChart(symbol, period);
  }

  async function renderChart(symbol, period = '3mo') {
    const canvas = document.getElementById(`canvas-${symbol}`);
    if (!canvas) return;
    let chartData;
    if (period === '3mo') {
      const d = scanResults[symbol];
      if (!d?.chart) return;
      chartData = { dates: d.chart.dates, closes: d.chart.closes, sma25: d.chart.sma25, avg_cost: d.portfolio?.avg_cost ?? null };
    } else {
      const loadEl = document.getElementById(`chart-loading-${symbol}`);
      if (loadEl) loadEl.style.display = 'block';
      canvas.style.opacity = '0.3';
      try {
        const res = await fetch(`/api/chart/${symbol}/${period}`);
        const data = await res.json();
        if (loadEl) loadEl.style.display = 'none';
        canvas.style.opacity = '1';
        if (data.error) return;
        chartData = data.chart;
      } catch(e) {
        const el = document.getElementById(`chart-loading-${symbol}`);
        if (el) el.style.display = 'none';
        canvas.style.opacity = '1';
        return;
      }
    }
    chartInstances[symbol] = makeChart(canvas, chartData, scanResults[symbol]);
  }

  // ── 共通チャート描画 ──────────────────────────────
  function makeChart(canvas, chartData, resultData) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)';
    const textColor = '#8E8E93';
    const isUp = resultData && (resultData.change_pct ?? resultData.pnl_pct ?? 0) >= 0;
    const lineColor = isUp ? '#30D158' : '#FF3B30';

    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.offsetHeight || 150);
    grad.addColorStop(0, isUp ? 'rgba(48,209,88,0.22)' : 'rgba(255,59,48,0.22)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    const datasets = [{
      label: '価格',
      data: chartData.closes,
      borderColor: lineColor,
      backgroundColor: grad,
      borderWidth: 2,
      fill: true,
      pointRadius: 0,
      tension: 0.35,
    }];

    if (chartData.sma25?.some(v => v !== null)) {
      datasets.push({
        label: 'SMA25',
        data: chartData.sma25,
        borderColor: 'rgba(255,159,10,0.75)',
        borderWidth: 1.5,
        pointRadius: 0,
        fill: false,
        tension: 0.35,
      });
    }

    if (chartData.avg_cost) {
      datasets.push({
        label: '取得単価',
        data: Array(chartData.dates.length).fill(chartData.avg_cost),
        borderColor: 'rgba(142,142,147,0.5)',
        borderWidth: 1.5,
        borderDash: [5, 4],
        pointRadius: 0,
        fill: false,
      });
    }

    return new Chart(canvas, {
      type: 'line',
      data: { labels: chartData.dates, datasets },
      options: {
        responsive: true,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toLocaleString('ja-JP', {maximumFractionDigits:2})}`,
            }
          }
        },
        scales: {
          x: {
            grid: { color: gridColor },
            ticks: { color: textColor, maxTicksLimit: 6, font: { size: 10 } },
          },
          y: {
            grid: { color: gridColor },
            position: 'right',
            ticks: { color: textColor, font: { size: 10 }, callback: v => v.toLocaleString('ja-JP', {maximumFractionDigits:0}) },
          }
        }
      }
    });
  }

  // ── 通知 ──────────────────────────────────────────
  let notifiedSignals = JSON.parse(localStorage.getItem('notifiedSignals') || '{}');

  async function requestNotification() {
    if (!('Notification' in window)) { alert('このブラウザは通知に対応していません。'); return; }
    const perm = await Notification.requestPermission();
    const btn = document.getElementById('btn-notify');
    if (perm === 'granted') {
      btn.classList.add('active');
      showNotification('投資ダッシュボード', '通知が有効になりました！');
    }
  }

  function showNotification(title, body) {
    if (Notification.permission !== 'granted') return;
    new Notification(title, { body, icon: '/static/icon.png' });
  }

  function checkAndNotify(data) {
    if (Notification.permission !== 'granted') return;
    (data.signals || []).filter(s => s.strength === 'STRONG').forEach(sig => {
      const key = `${data.symbol}_${sig.type}_${sig.reason}`;
      if (!notifiedSignals[key]) {
        notifiedSignals[key] = Date.now();
        localStorage.setItem('notifiedSignals', JSON.stringify(notifiedSignals));
        showNotification(`${data.name} ${sig.type === 'BUY' ? '買いシグナル' : '売りシグナル'}`, sig.reason);
      }
    });
    const cutoff = Date.now() - 86400000;
    Object.keys(notifiedSignals).forEach(k => { if (notifiedSignals[k] < cutoff) delete notifiedSignals[k]; });
  }

  function initNotifyButton() {
    const btn = document.getElementById('btn-notify');
    if (!('Notification' in window)) { btn.style.display = 'none'; return; }
    if (Notification.permission === 'granted') btn.classList.add('active');
  }

  // ── テーマ切り替え ────────────────────────────────
  (function() {
    let saved;
    try { saved = localStorage.getItem('theme'); } catch(e) {}
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    let next;
    if (!cur) next = 'dark';
    else if (cur === 'dark') next = 'light';
    else next = null;
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('theme', next || 'system'); } catch(e) {}
    const icons = { dark: '🌙', light: '☀️', null: '🌓' };
    document.getElementById('btn-theme').textContent = icons[next] ?? '🌓';
  }

  // ── ソート／フィルター ────────────────────────────
  let sortBy = 'default';
  let filterBuyOnly = false;

  function setSortBy(s) {
    sortBy = s;
    document.querySelectorAll('.btn-sort:not(.buy-filter)').forEach(b =>
      b.classList.toggle('active', b.dataset.sort === s));
    applySortFilter();
  }

  function toggleFilterBuy() {
    filterBuyOnly = !filterBuyOnly;
    document.getElementById('btn-filter-buy').classList.toggle('active', filterBuyOnly);
    applySortFilter();
  }

  function applySortFilter() {
    const wl = document.getElementById('watchlist');
    const cards = [...wl.querySelectorAll('.card')];
    cards.forEach(c => {
      const sym = c.id.replace('card-', '');
      const d = scanResults[sym];
      if (filterBuyOnly && d) {
        const hasBuy = d.summary === 'BUY' || d.summary === 'STRONG_BUY' ||
          (d.signals || []).some(s => s.type === 'BUY');
        c.style.display = hasBuy ? '' : 'none';
      } else {
        c.style.display = '';
      }
    });
    if (sortBy === 'default') return;
    const visible = cards.filter(c => c.style.display !== 'none');
    visible.sort((a, b) => {
      const da = scanResults[a.id.replace('card-', '')];
      const db = scanResults[b.id.replace('card-', '')];
      if (!da || !db) return 0;
      if (sortBy === 'change') return db.change_pct - da.change_pct;
      if (sortBy === 'pnl') {
        const pa = da.portfolio?.pnl_pct ?? -9999;
        const pb = db.portfolio?.pnl_pct ?? -9999;
        return pb - pa;
      }
      return 0;
    });
    visible.forEach(c => wl.appendChild(c));
  }

  // ── 投信合計サマリー ──────────────────────────────
  function renderFundTotal() {
    const el = document.getElementById('fund-total-summary');
    if (!el) return;
    let totalCost = 0, totalVal = 0, totalPnl = 0, count = 0;
    funds.forEach(f => {
      const fd = fundResults[f.code];
      if (!fd) return;
      totalCost += fd.cost;
      totalVal += Math.round(fd.price / 10000 * fd.kuchi);
      totalPnl += (fd.pnl || 0);
      count++;
    });
    if (count === 0) { el.innerHTML = ''; return; }
    const ratio = totalCost > 0 ? totalVal / totalCost * 100 : 0;
    const fillW = Math.min(100, ratio).toFixed(1);
    const pnlCls = totalPnl >= 0 ? 'pos' : 'neg';
    el.innerHTML = `
      <div class="fund-total-card">
        <div class="fund-total-row">
          <div>
            <div class="fund-total-label">合計評価額</div>
            <div class="fund-total-val">¥${totalVal.toLocaleString('ja-JP')}</div>
          </div>
          <div style="text-align:right">
            <div class="fund-total-label">合計損益</div>
            <div class="fund-total-val ${pnlCls}">${totalPnl >= 0 ? '+' : ''}¥${Math.abs(totalPnl).toLocaleString('ja-JP',{maximumFractionDigits:0})}</div>
          </div>
        </div>
        <div class="fund-total-bar-wrap">
          <div class="fund-total-bar-fill" style="width:${fillW}%"></div>
        </div>
        <div class="fund-total-meta">取得額 ¥${totalCost.toLocaleString('ja-JP')} に対して ${ratio.toFixed(1)}%（${count}ファンド）</div>
      </div>`;
  }

  // ── 数値カウントアップ ────────────────────────────
  function countUp(el, target, duration = 600) {
    const start = Date.now();
    const from = parseInt(el.textContent.replace(/[^\d]/g, '')) || 0;
    const prefix = target >= 0 ? '¥' : '-¥';
    const abs = Math.abs(target);
    function step() {
      const t = Math.min(1, (Date.now() - start) / duration);
      const ease = 1 - Math.pow(1 - t, 3);
      const val = Math.round(from + (abs - from) * ease);
      el.textContent = `${prefix}${val.toLocaleString('ja-JP')}`;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ── プルトゥリフレッシュ ──────────────────────────
  (function() {
    const pill = document.getElementById('ptr-pill');
    const txt = document.getElementById('ptr-text');
    const THRESHOLD = 65;
    let startY = 0, pulling = false, ready = false;

    document.addEventListener('touchstart', e => {
      if (window.scrollY > 0) return;
      startY = e.touches[0].clientY;
      pulling = false; ready = false;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (startY === 0) return;
      const dy = e.touches[0].clientY - startY;
      if (dy < 10) return;
      pulling = true;
      pill.classList.add('visible');
      if (dy >= THRESHOLD) {
        if (!ready) { ready = true; pill.classList.add('ready'); txt.textContent = '離して更新'; }
      } else {
        if (ready) { ready = false; pill.classList.remove('ready'); txt.textContent = '引いて更新'; }
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (!pulling) return;
      startY = 0; pulling = false;
      if (ready) {
        ready = false;
        pill.classList.remove('ready');
        pill.classList.add('refreshing');
        txt.textContent = '更新中...';
        scanAll().finally(() => {
          pill.classList.remove('refreshing', 'visible');
          txt.textContent = '引いて更新';
        });
      } else {
        pill.classList.remove('visible', 'ready');
      }
    });
  })();

  // ── スワイプでタブ切り替え ────────────────────────
  (function() {
    const content = document.querySelector('.content');
    let tx = 0, ty = 0;
    content.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }, { passive: true });
    content.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      const tabs = ['stocks', 'funds'];
      const active = document.querySelector('.nav-btn.active')?.id.replace('nav-btn-', '');
      const idx = tabs.indexOf(active);
      if (dx < 0 && idx < tabs.length - 1) switchTab(tabs[idx + 1]);
      else if (dx > 0 && idx > 0) switchTab(tabs[idx - 1]);
    }, { passive: true });
  })();

  // ── 起動 ──────────────────────────────────────────
  initNotifyButton();
  init();
</script>
</body>
</html>
